apiVersion: v1
kind: Service
metadata:
  name: {{ include "dienstreise.fullname" . }}
  labels:
    {{- include "dienstreise.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dienstreise.selectorLabels" . | nindent 4 }}
  # Only the application port; the management port (8081) is not exposed.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
